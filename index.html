<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIM · Rodízio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F6F5;
    --surface:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6673;
    --ink-faint:#8B94A0;
    --line:#DCE3E0;
    --line-strong:#C3CCC8;
    --accent:#145B5F;
    --accent-ink:#FFFFFF;
    --presencial:#2C5F8A;    --presencial-bg:#E3EDF5;
    --home:#3F7D52;          --home-bg:#E6F0E8;
    --externo:#B5722E;       --externo-bg:#F5E9DA;
    --outro:#6B5B7A;         --outro-bg:#EDE7F0;
    --empty-bg:#EEF0EF;
    --danger:#B23A3A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px;}

  /* login gate */
  .gate-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .gate-box{background:var(--surface);border:1px solid var(--line);padding:32px 28px;max-width:340px;width:100%;}
  .gate-box h1{font-size:18px;font-weight:800;margin:0 0 6px;}
  .gate-box p{font-size:13px;color:var(--ink-soft);margin:0 0 18px;line-height:1.5;}
  .gate-box input{width:100%;margin-bottom:10px;}
  .gate-error{font-size:12px;color:var(--danger);font-weight:700;margin-bottom:10px;min-height:14px;}

  /* header */
  .app-header{
    display:flex;align-items:baseline;justify-content:space-between;
    padding-bottom:14px;margin-bottom:18px;border-bottom:2px solid var(--ink);
    flex-wrap:wrap;gap:6px;
  }
  .app-header h1{font-size:20px;font-weight:800;letter-spacing:-0.02em;margin:0;}
  .app-header h1 span{color:var(--accent);}
  .app-header .today{font-size:13px;color:var(--ink-soft);font-weight:500;text-transform:capitalize;}
  .conn-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3F7D52;margin-right:5px;vertical-align:middle;}
  .conn-dot.off{background:var(--danger);}

  /* tabs */
  .tabs{display:flex;gap:2px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .tab-btn{
    background:none;border:none;font-family:inherit;font-size:14px;font-weight:700;
    color:var(--ink-faint);padding:10px 4px;margin-right:22px;cursor:pointer;
    border-bottom:2px solid transparent;position:relative;top:1px;
  }
  .tab-btn.active{color:var(--ink);border-bottom:2px solid var(--accent);}

  /* who-are-you row */
  .person-row{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:12px 14px;background:var(--surface);border:1px solid var(--line);
    margin-bottom:18px;
  }
  .person-row label{font-size:13px;color:var(--ink-soft);font-weight:600;}
  select, input[type=text], input[type=password]{
    font-family:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink);border-radius:3px;
  }
  select:focus, input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .btn{
    font-family:inherit;font-size:13px;font-weight:700;padding:7px 12px;border-radius:3px;
    border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn-primary:hover{opacity:0.9;}
  .btn-primary:disabled{opacity:0.6;cursor:default;}
  .btn-text{border:none;background:none;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;padding:4px 2px;}
  .add-person-inline{display:flex;gap:6px;align-items:center;}

  /* month nav */
  .month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px;}
  .month-nav button{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);
    cursor:pointer;font-size:15px;color:var(--ink);line-height:1;
  }
  .month-nav button:hover{background:var(--empty-bg);}
  .month-nav .label{font-size:16px;font-weight:800;letter-spacing:-0.01em;min-width:170px;text-align:center;text-transform:capitalize;}

  /* calendar grid */
  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
  .weekday-row div{text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .day-cell{
    aspect-ratio:1/1;background:var(--surface);border:1px solid var(--line);border-radius:4px;
    display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;cursor:pointer;
    min-height:52px;
  }
  .day-cell.blank{background:transparent;border:none;cursor:default;}
  .day-cell.weekend{background:#F8F9F8;}
  .day-cell:hover:not(.blank){border-color:var(--ink-faint);}
  .day-cell.today{border:2px solid var(--ink);}
  .day-num{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .day-badge{align-self:flex-start;font-size:11px;font-weight:800;padding:2px 6px;border-radius:3px;}
  .badge-P{background:var(--presencial);color:#fff;}
  .badge-H{background:var(--home);color:#fff;}
  .badge-E{background:var(--externo);color:#fff;}
  .badge-O{background:var(--outro);color:#fff;}
  .day-plus{font-size:14px;color:var(--ink-faint);align-self:flex-start;}
  .badge-row{display:flex;gap:3px;flex-wrap:wrap;align-self:flex-start;}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);font-weight:600;}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .dot-P{background:var(--presencial);} .dot-H{background:var(--home);} .dot-E{background:var(--externo);} .dot-O{background:var(--outro);}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(20,25,30,0.45);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .modal{background:var(--surface);border-radius:6px;padding:22px;max-width:360px;width:100%;box-shadow:0 12px 32px rgba(0,0,0,0.18);}
  .modal h3{margin:0 0 2px;font-size:16px;font-weight:800;text-transform:capitalize;}
  .modal .modal-person{font-size:12px;color:var(--ink-soft);margin-bottom:16px;font-weight:600;}
  .status-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .status-opt{border:1.5px solid var(--line-strong);border-radius:4px;padding:10px 8px;text-align:left;background:var(--surface);cursor:pointer;font-family:inherit;}
  .status-opt .opt-title{font-size:13px;font-weight:800;}
  .status-opt.sel-P{border-color:var(--presencial);background:var(--presencial-bg);}
  .status-opt.sel-H{border-color:var(--home);background:var(--home-bg);}
  .status-opt.sel-E{border-color:var(--externo);background:var(--externo-bg);}
  .status-opt.sel-O{border-color:var(--outro);background:var(--outro-bg);}
  .sub-field{margin-bottom:14px;}
  .sub-field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .sub-field select, .sub-field input{width:100%;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}

  /* team panel */
  .today-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
  .stat{border:1px solid var(--line);background:var(--surface);padding:12px 14px;}
  .stat .num{font-size:26px;font-weight:800;letter-spacing:-0.02em;line-height:1;}
  .stat .lbl{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:4px;}
  .stat.num-P .num{color:var(--presencial);}
  .stat.num-H .num{color:var(--home);}
  .stat.num-E .num{color:var(--externo);}
  .stat.num-miss .num{color:var(--danger);}

  .today-list{margin-bottom:28px;}
  .today-list h2, .grid-section h2{font-size:14px;font-weight:800;margin:0 0 10px;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:20px;background:var(--empty-bg);font-size:12.5px;font-weight:700;border:1px solid var(--line);}
  .chip .cdot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);}
  .chip.st-P .cdot{background:var(--presencial);} .chip.st-P{background:var(--presencial-bg);border-color:transparent;}
  .chip.st-H .cdot{background:var(--home);} .chip.st-H{background:var(--home-bg);border-color:transparent;}
  .chip.st-E .cdot{background:var(--externo);} .chip.st-E{background:var(--externo-bg);border-color:transparent;}
  .chip.st-O .cdot{background:var(--outro);} .chip.st-O{background:var(--outro-bg);border-color:transparent;}
  .chip.st-none{color:var(--ink-faint);}

  .grid-section{overflow-x:auto;}
  table.team-grid{border-collapse:collapse;width:100%;min-width:760px;font-size:11px;}
  table.team-grid th, table.team-grid td{border:1px solid var(--line);padding:0;text-align:center;}
  table.team-grid th{background:var(--empty-bg);font-weight:700;color:var(--ink-soft);padding:5px 2px;font-size:10.5px;}
  table.team-grid td.name-cell{text-align:left;padding:6px 8px;font-weight:700;white-space:nowrap;background:var(--surface);position:sticky;left:0;}
  table.team-grid td.day-td{width:22px;height:26px;font-weight:800;color:#fff;}
  table.team-grid td.weekend-td{background:#F8F9F8;}
  table.team-grid td.tot-cell{font-weight:800;color:var(--ink);background:var(--surface);}

  .loading{padding:60px 0;text-align:center;color:var(--ink-faint);font-weight:600;font-size:13px;}
  .hint{font-size:12px;color:var(--ink-faint);margin-top:6px;}

  @media (max-width:560px){
    .today-summary{grid-template-columns:repeat(2,1fr);}
    .day-num{font-size:10px;}
    .day-badge{font-size:9.5px;padding:1px 4px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="loading">Carregando…</div>
</div>

<script type="module">
/* =====================================================================
   CONFIGURAÇÃO — edite estas 2 seções antes de publicar
   ===================================================================== */

// 1) Cole aqui o firebaseConfig que o Firebase te deu ao registrar o app web
//    (Firebase console > Configurações do projeto > seus apps > SDK setup)
const firebaseConfig = {
  apiKey: "AIzaSyBJknImdOlppF3ksvQFK7BMB-dNmD7nvnA",
  authDomain: "cim---rodizio.firebaseapp.com",
  projectId: "cim---rodizio",
  storageBucket: "cim---rodizio.firebasestorage.app",
  messagingSenderId: "279641317663",
  appId: "1:279641317663:web:3c5deb48dece984503502a"
};

// 2) Defina a senha que a equipe vai usar para entrar.
//    Isso é apenas uma trava simples para evitar acesso casual por engano —
//    não é uma autenticação de verdade. Troque sempre que alguém sair da equipe.
const SHARED_PASSCODE = "cim2026";

/* ===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

const STATUS_META = {
  P: { label: 'Presencial' }, H: { label: 'Home office' },
  E: { label: 'Externo' }, O: { label: 'Outro / observação' }
};
const STATUS_BG = { P:'#E3EDF5', H:'#E6F0E8', E:'#F5E9DA', O:'#EDE7F0' };
const STATUS_SOLID = { P:'#2C5F8A', H:'#3F7D52', E:'#B5722E', O:'#6B5B7A' };
const LOCAL_OPTIONS = ['CEVEN','Lojas','CL','Evento','Outro'];
const WEEKDAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DEFAULT_TEAM = ["Caciane Sousa","Caroline Koppe","Caroline Castro","Daniel Almerindo","Dayanne Oliveira",
  "Deborah Dias","Gabriela Olindo","Juliana Borges","Kaylla Jordão","Lara Santos","Lorenna Negris",
  "Lorrany Silva","Mateus Assunção","Mayza Rodovalho","Maria Vieira","Thais Gonçalves","Thaisy Santos",
  "Thalya Marcelino","Yago Loyola"];

const now = new Date();
const state = {
  team: [], person: null, year: now.getFullYear(), month: now.getMonth(),
  activeTab: 'meu', monthCache: {}, watched: {}, modalDay: null, modalDraft: null, addingPerson: false
};

function pad2(n){ return String(n).padStart(2,'0'); }
function monthKey(y,m){ return `${y}-${pad2(m+1)}`; }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function firstWeekday(y,m){ return new Date(y, m, 1).getDay(); }
function todayKey(){ return monthKey(now.getFullYear(), now.getMonth()); }
function isToday(y,m,d){ return y===now.getFullYear() && m===now.getMonth() && d===now.getDate(); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getEntry(monthData, person, day){ return (monthData && monthData[person] && monthData[person][String(day)]) || null; }
function setEntry(monthData, person, day, entry){
  if(!monthData[person]) monthData[person] = {};
  if(entry) monthData[person][String(day)] = entry; else delete monthData[person][String(day)];
}
function badgeText(entry){ return (!entry || !entry.statuses || !entry.statuses.length) ? '' : entry.statuses.join('/'); }
function mixedGradient(codes, palette){
  if(codes.length===1) return palette[codes[0]];
  const stops = codes.slice(0,3); const step = 100/stops.length;
  return `linear-gradient(135deg, ${stops.map((c,i)=>`${palette[c]} ${Math.round(i*step)}%, ${palette[c]} ${Math.round((i+1)*step)}%`).join(', ')})`;
}

/* ---------- gate ---------- */
function renderGate(){
  document.getElementById('app').innerHTML = `
    <div class="gate-wrap">
      <div class="gate-box">
        <h1>CIM · Rodízio</h1>
        <p>Digite a senha da equipe para acessar o rodízio.</p>
        <div class="gate-error" id="gate-error"></div>
        <input type="password" id="gate-input" placeholder="Senha">
        <button class="btn btn-primary" id="gate-btn" style="width:100%;">Entrar</button>
      </div>
    </div>`;
  const tryLogin = ()=>{
    const val = document.getElementById('gate-input').value;
    if(val === SHARED_PASSCODE){
      localStorage.setItem('cim-auth','ok');
      boot();
    } else {
      document.getElementById('gate-error').textContent = 'Senha incorreta.';
    }
  };
  document.getElementById('gate-btn').onclick = tryLogin;
  document.getElementById('gate-input').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
}

/* ---------- data layer (Firestore) ---------- */
function watchMonth(key){
  if(state.watched[key]) return;
  state.watched[key] = true;
  onSnapshot(doc(db,'meses',key), snap=>{
    state.monthCache[key] = snap.exists() ? snap.data() : {};
    render();
  }, err=>{ console.error(err); });
}

async function saveMonth(key){
  try{ await setDoc(doc(db,'meses',key), state.monthCache[key] || {}); }
  catch(e){ console.error(e); alert('Não foi possível salvar agora. Verifique sua conexão e tente novamente.'); }
}

function watchTeam(){
  onSnapshot(doc(db,'meta','equipe'), async snap=>{
    if(snap.exists()){ state.team = snap.data().nomes || []; }
    else { state.team = DEFAULT_TEAM.slice(); await setDoc(doc(db,'meta','equipe'), {nomes: state.team}); }
    render();
  }, err=>{ console.error(err); });
}

async function saveTeam(){
  try{ await setDoc(doc(db,'meta','equipe'), {nomes: state.team}); }catch(e){ console.error(e); }
}

function loadPerson(){ state.person = localStorage.getItem('meu-nome') || null; }
function savePerson(name){ state.person = name; localStorage.setItem('meu-nome', name); }

/* ---------- boot ---------- */
function boot(){
  loadPerson();
  watchTeam();
  watchMonth(monthKey(state.year, state.month));
  if(monthKey(state.year,state.month) !== todayKey()) watchMonth(todayKey());
  render();
}

/* ---------- render ---------- */
function render(){
  const app = document.getElementById('app');
  const dateLbl = now.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
  app.innerHTML = `
    <div class="wrap">
      <div class="app-header">
        <h1>CIM <span>·</span> Rodízio</h1>
        <div class="today"><span class="conn-dot"></span>${dateLbl}</div>
      </div>
      <div class="tabs">
        <button class="tab-btn ${state.activeTab==='meu'?'active':''}" data-tab="meu">Meu registro</button>
        <button class="tab-btn ${state.activeTab==='painel'?'active':''}" data-tab="painel">Painel da equipe</button>
      </div>
      <div id="tab-content"></div>
    </div>`;
  app.querySelectorAll('.tab-btn').forEach(b=>{ b.onclick = ()=>{ state.activeTab = b.dataset.tab; render(); }; });
  if(state.activeTab==='meu') renderMeuTab(); else renderPainelTab();
}

function personRowHTML(){
  const options = state.team.map(n=>`<option value="${escapeHtml(n)}" ${n===state.person?'selected':''}>${escapeHtml(n)}</option>`).join('');
  return `
    <div class="person-row">
      <label>Quem é você?</label>
      <select id="person-select"><option value="">Selecionar…</option>${options}</select>
      ${state.addingPerson ? `
        <div class="add-person-inline">
          <input type="text" id="new-person-input" placeholder="Nome completo" style="width:170px;">
          <button class="btn btn-primary" id="confirm-add-person">Adicionar</button>
          <button class="btn-text" id="cancel-add-person">cancelar</button>
        </div>
      ` : `<button class="btn-text" id="show-add-person">+ adicionar pessoa</button>`}
    </div>`;
}

function bindPersonRow(afterChange){
  document.getElementById('person-select').onchange = (e)=>{ if(e.target.value){ savePerson(e.target.value); } afterChange(); };
  const showBtn = document.getElementById('show-add-person');
  if(showBtn) showBtn.onclick = ()=>{ state.addingPerson = true; afterChange(); };
  const cancelBtn = document.getElementById('cancel-add-person');
  if(cancelBtn) cancelBtn.onclick = ()=>{ state.addingPerson = false; afterChange(); };
  const confirmBtn = document.getElementById('confirm-add-person');
  if(confirmBtn) confirmBtn.onclick = async ()=>{
    const input = document.getElementById('new-person-input');
    const name = input.value.trim();
    if(!name) return;
    if(!state.team.includes(name)){ state.team.push(name); state.team.sort((a,b)=>a.localeCompare(b,'pt-BR')); await saveTeam(); }
    state.addingPerson = false;
    savePerson(name);
    afterChange();
  };
}

function monthNavHTML(){
  return `
    <div class="month-nav">
      <button id="prev-month" aria-label="Mês anterior">‹</button>
      <div class="label">${MONTHS[state.month]} de ${state.year}</div>
      <button id="next-month" aria-label="Próximo mês">›</button>
    </div>`;
}

function bindMonthNav(afterChange){
  document.getElementById('prev-month').onclick = ()=>{
    state.month -= 1; if(state.month<0){ state.month=11; state.year -=1; }
    watchMonth(monthKey(state.year,state.month)); afterChange();
  };
  document.getElementById('next-month').onclick = ()=>{
    state.month += 1; if(state.month>11){ state.month=0; state.year +=1; }
    watchMonth(monthKey(state.year,state.month)); afterChange();
  };
}

function renderMeuTab(){
  const el = document.getElementById('tab-content');
  el.innerHTML = personRowHTML() + monthNavHTML() + `<div id="calendar-holder"></div>`;
  bindPersonRow(renderMeuTab);
  bindMonthNav(renderMeuTab);
  renderCalendar();
}

function renderCalendar(){
  const holder = document.getElementById('calendar-holder');
  if(!holder) return;
  if(!state.person){ holder.innerHTML = `<p class="hint">Selecione seu nome acima para começar a marcar seus dias.</p>`; return; }
  const key = monthKey(state.year, state.month);
  const monthData = state.monthCache[key] || {};
  const nDays = daysInMonth(state.year, state.month);
  const lead = firstWeekday(state.year, state.month);

  let cells = '';
  for(let i=0;i<lead;i++) cells += `<div class="day-cell blank"></div>`;
  for(let d=1; d<=nDays; d++){
    const entry = getEntry(monthData, state.person, d);
    const hasEntry = entry && entry.statuses && entry.statuses.length;
    const weekday = new Date(state.year, state.month, d).getDay();
    const weekend = (weekday===0 || weekday===6);
    const todayClass = isToday(state.year,state.month,d) ? 'today' : '';
    const bgStyle = hasEntry ? `style="background:${mixedGradient(entry.statuses, STATUS_BG)};"` : '';
    const badges = hasEntry ? `<div class="badge-row">${entry.statuses.map(c=>`<span class="day-badge badge-${c}">${c}</span>`).join('')}</div>` : `<div class="day-plus">+</div>`;
    cells += `<div class="day-cell ${weekend?'weekend':''} ${todayClass}" ${bgStyle} data-day="${d}"><div class="day-num">${d}</div>${badges}</div>`;
  }

  holder.innerHTML = `
    <div class="weekday-row">${WEEKDAYS.map(w=>`<div>${w}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="legend">
      <div class="legend-item"><span class="dot dot-P"></span>Presencial</div>
      <div class="legend-item"><span class="dot dot-H"></span>Home office</div>
      <div class="legend-item"><span class="dot dot-E"></span>Externo</div>
      <div class="legend-item"><span class="dot dot-O"></span>Outro / observação</div>
    </div>`;
  holder.querySelectorAll('.day-cell:not(.blank)').forEach(c=>{ c.onclick = ()=> openModal(parseInt(c.dataset.day,10)); });
}

/* ---------- modal ---------- */
function openModal(day){
  const key = monthKey(state.year, state.month);
  const monthData = state.monthCache[key] || {};
  const existing = getEntry(monthData, state.person, day);
  state.modalDay = day;
  state.modalDraft = existing ? { statuses:[...(existing.statuses||[])], local: existing.local, note: existing.note } : {statuses:[]};
  renderModal();
}
function closeModal(){ state.modalDay = null; state.modalDraft = null; const ov = document.getElementById('overlay'); if(ov) ov.remove(); }

function renderModal(){
  let ov = document.getElementById('overlay');
  if(!ov){
    ov = document.createElement('div'); ov.className='overlay'; ov.id='overlay';
    document.body.appendChild(ov);
    ov.addEventListener('click', (e)=>{ if(e.target===ov) closeModal(); });
  }
  const d = state.modalDraft;
  const dateLabel = new Date(state.year, state.month, state.modalDay).toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
  const opt = (code)=>`<button class="status-opt ${d.statuses.includes(code)?'sel-'+code:''}" data-status="${code}"><div class="opt-title">${STATUS_META[code].label}</div></button>`;

  let subField = '';
  if(d.statuses.includes('E')){
    subField += `<div class="sub-field"><label>Local</label><select id="local-select"><option value="">Selecionar…</option>${LOCAL_OPTIONS.map(l=>`<option value="${l}" ${d.local===l?'selected':''}>${l}</option>`).join('')}</select></div>`;
  }
  if(d.statuses.includes('O')){
    subField += `<div class="sub-field"><label>Observação</label><input type="text" id="note-input" value="${escapeHtml(d.note||'')}" placeholder="ex: férias, atestado, folga…"></div>`;
  }

  ov.innerHTML = `
    <div class="modal">
      <h3>${dateLabel}</h3>
      <div class="modal-person">${escapeHtml(state.person)} · toque em mais de uma opção se o dia foi dividido</div>
      <div class="status-options">${opt('P')}${opt('H')}${opt('E')}${opt('O')}</div>
      ${subField}
      <div class="modal-actions">
        <button class="btn-text" id="clear-day" style="color:var(--danger);">limpar dia</button>
        <button class="btn btn-primary" id="close-modal">Fechar</button>
      </div>
    </div>`;

  ov.querySelectorAll('.status-opt').forEach(b=>{
    b.onclick = async ()=>{
      const code = b.dataset.status;
      const idx = state.modalDraft.statuses.indexOf(code);
      if(idx>-1) state.modalDraft.statuses.splice(idx,1); else state.modalDraft.statuses.push(code);
      await persistDraft(); renderModal();
    };
  });
  const localSel = document.getElementById('local-select');
  if(localSel) localSel.onchange = async ()=>{ state.modalDraft.local = localSel.value; await persistDraft(); };
  const noteInput = document.getElementById('note-input');
  if(noteInput) noteInput.onblur = async ()=>{ state.modalDraft.note = noteInput.value; await persistDraft(); };
  document.getElementById('clear-day').onclick = async ()=>{
    const key = monthKey(state.year, state.month);
    setEntry(state.monthCache[key], state.person, state.modalDay, null);
    await saveMonth(key); closeModal(); renderCalendar();
  };
  document.getElementById('close-modal').onclick = ()=>{ closeModal(); renderCalendar(); };
}

async function persistDraft(){
  const key = monthKey(state.year, state.month);
  if(state.modalDraft.statuses && state.modalDraft.statuses.length){
    setEntry(state.monthCache[key], state.person, state.modalDay, {...state.modalDraft});
  } else {
    setEntry(state.monthCache[key], state.person, state.modalDay, null);
  }
  await saveMonth(key);
}

/* ---------- painel da equipe ---------- */
function renderPainelTab(){
  const el = document.getElementById('tab-content');
  el.innerHTML = monthNavHTML() + `<div id="painel-holder"></div>`;
  bindMonthNav(renderPainelTab);
  renderPainelContent();
}

function renderPainelContent(){
  const holder = document.getElementById('painel-holder');
  if(!holder) return;
  const tKey = todayKey();
  const todayData = state.monthCache[tKey] || {};
  const d = now.getDate();

  let cP=0, cH=0, cE=0, cMiss=0;
  const chips = state.team.map(person=>{
    const entry = getEntry(todayData, person, d);
    const hasEntry = entry && entry.statuses && entry.statuses.length;
    if(hasEntry){ entry.statuses.forEach(s=>{ if(s==='P') cP++; else if(s==='H') cH++; else if(s==='E') cE++; }); } else cMiss++;
    const cls = hasEntry ? `st-${entry.statuses[0]}` : 'st-none';
    const label = hasEntry ? entry.statuses.map(s=> s==='E' && entry.local ? `Externo · ${entry.local}` : STATUS_META[s].label).join(' + ') : 'não preenchido';
    return `<div class="chip ${cls}"><span class="cdot"></span>${escapeHtml(person)} — ${label}</div>`;
  }).join('');

  const key = monthKey(state.year, state.month);
  const monthData = state.monthCache[key] || {};
  const nDays = daysInMonth(state.year, state.month);
  let headerCells = ''; for(let dd=1; dd<=nDays; dd++) headerCells += `<th>${dd}</th>`;

  let rows = '';
  state.team.forEach(person=>{
    let cells=''; let totP=0, totH=0, totE=0;
    for(let dd=1; dd<=nDays; dd++){
      const entry = getEntry(monthData, person, dd);
      const hasEntry = entry && entry.statuses && entry.statuses.length;
      const weekday = new Date(state.year, state.month, dd).getDay();
      const weekend = (weekday===0||weekday===6);
      if(hasEntry){
        entry.statuses.forEach(s=>{ if(s==='P') totP++; else if(s==='H') totH++; else if(s==='E') totE++; });
        const title = `${escapeHtml(person)} · dia ${dd} · ${entry.statuses.map(s=>STATUS_META[s].label).join(' + ')}${entry.local?(' · '+entry.local):''}${entry.note?(' · '+escapeHtml(entry.note)):''}`;
        cells += `<td class="day-td" style="background:${mixedGradient(entry.statuses, STATUS_SOLID)};" title="${title}">${badgeText(entry)}</td>`;
      } else {
        cells += `<td class="day-td ${weekend?'weekend-td':''}"></td>`;
      }
    }
    rows += `<tr><td class="name-cell">${escapeHtml(person)}</td>${cells}<td class="tot-cell">${totP}</td><td class="tot-cell">${totH}</td><td class="tot-cell">${totE}</td></tr>`;
  });

  holder.innerHTML = `
    <div class="today-summary">
      <div class="stat num-P"><div class="num">${cP}</div><div class="lbl">Presencial hoje</div></div>
      <div class="stat num-H"><div class="num">${cH}</div><div class="lbl">Home office hoje</div></div>
      <div class="stat num-E"><div class="num">${cE}</div><div class="lbl">Externo hoje</div></div>
      <div class="stat num-miss"><div class="num">${cMiss}</div><div class="lbl">Não preencheram</div></div>
    </div>
    <div class="today-list">
      <h2>Hoje · ${now.toLocaleDateString('pt-BR',{day:'numeric',month:'long'})}</h2>
      <div class="chip-row">${chips}</div>
    </div>
    <div class="grid-section">
      <h2>${MONTHS[state.month]} de ${state.year} · visão completa</h2>
      <table class="team-grid">
        <thead><tr><th style="text-align:left;">Colaborador</th>${headerCells}<th>P</th><th>H</th><th>E</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="legend">
        <div class="legend-item"><span class="dot dot-P"></span>Presencial</div>
        <div class="legend-item"><span class="dot dot-H"></span>Home office</div>
        <div class="legend-item"><span class="dot dot-E"></span>Externo</div>
        <div class="legend-item"><span class="dot dot-O"></span>Outro / observação</div>
      </div>
    </div>`;
}

/* ---------- start ---------- */
if(localStorage.getItem('cim-auth') === 'ok'){ boot(); } else { renderGate(); }
</script>
</body>
</html>
