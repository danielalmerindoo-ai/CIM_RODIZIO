<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIM · Rodízio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A0E27; --navy-soft:#151A3A;
    --bg:#F4F6FB; --surface:#FFFFFF; --ink:#0B0F2A; --ink-soft:#5A6178; --ink-faint:#8990AC;
    --line:#E4E7F2; --line-strong:#C7CCE0; --accent:#2E4FFF; --accent-ink:#FFFFFF;
    --presencial:#1F3A93; --presencial-bg:#E4E8F7;
    --home:#3C6E4A; --home-bg:#E3EEE6;
    --externo:#A85A2A; --externo-bg:#F3E4D6;
    --outro:#5B4E68; --outro-bg:#E9E5ED;
    --empty-bg:#EEF0F7; --danger:#B23A3A;
    --holiday-bg:#FBF0DC; --holiday-ink:#8A6416; --weekend-bg:#F7F8FC;
    --shadow: 0 10px 28px rgba(10,14,40,0.09);
    --radius: 14px;
  }
  :root[data-theme="dark"]{
    --navy:#05070F; --navy-soft:#0D1128;
    --bg:#0A0E27; --surface:#12162F; --ink:#EEF1FB; --ink-soft:#A5ABC9; --ink-faint:#6D7497;
    --line:#232A4D; --line-strong:#323B63; --empty-bg:#161B38;
    --presencial-bg:#1B2350; --home-bg:#182A20; --externo-bg:#2E2013; --outro-bg:#241F30;
    --holiday-bg:#3A2E14; --holiday-ink:#E0B65C; --weekend-bg:#0F1430;
    --shadow: 0 10px 28px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Onest',ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px 50px;}

  .gate-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--navy);}
  .gate-box{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 28px;max-width:340px;width:100%;}
  .gate-box h1{font-size:19px;font-weight:800;margin:0 0 6px;letter-spacing:-0.01em;}
  .gate-box p{font-size:13px;color:var(--ink-soft);margin:0 0 18px;line-height:1.5;}
  .gate-box input{width:100%;margin-bottom:10px;}
  .gate-error{font-size:12px;color:var(--danger);font-weight:700;margin-bottom:10px;min-height:14px;}

  .topnav{background:var(--navy);position:sticky;top:0;z-index:20;}
  .topnav-inner{width:100%;margin:0;padding:0 32px;display:flex;align-items:center;height:60px;gap:28px;}
  .brand{display:flex;align-items:center;font-size:16px;font-weight:800;color:#fff;letter-spacing:-0.01em;white-space:nowrap;}
  .brand .mark{display:inline-block;width:8px;height:8px;background:var(--accent);margin:0 8px 1px;transform:skewX(-14deg);}
  .brand .sub{font-weight:500;color:#A9B0D6;margin-left:2px;}
  .nav-tabs{display:flex;gap:26px;flex:1;}
  .nav-tab{background:none;border:none;font-family:inherit;font-size:13.5px;font-weight:700;letter-spacing:0.02em;color:#8B93BC;padding:22px 0;cursor:pointer;border-bottom:2px solid transparent;}
  .nav-tab.active{color:#fff;border-bottom-color:var(--accent);}
  .nav-right{display:flex;align-items:center;gap:14px;}
  .nav-date{font-size:12.5px;color:#8B93BC;font-weight:500;text-transform:capitalize;white-space:nowrap;}
  .theme-btn{border:1px solid #2A3060;background:transparent;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:-0.02em;}

  .hero{padding:38px 0 26px;}
  .eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .eyebrow span{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:0.06em;text-transform:uppercase;}
  .eyebrow i{flex:0 0 34px;height:2px;background:var(--accent);display:block;}
  .headline{font-size:38px;font-weight:800;letter-spacing:-0.02em;margin:0 0 10px;color:var(--ink);line-height:1.08;}
  .headline .accent-word{color:var(--accent);}
  .hero-sub{font-size:15px;color:var(--ink-soft);max-width:560px;line-height:1.55;margin:0;}

  .reminder-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--holiday-bg);border-radius:10px;color:var(--holiday-ink);padding:12px 16px;margin-bottom:20px;font-size:13px;font-weight:700;flex-wrap:wrap;}
  .reminder-banner button{white-space:nowrap;}

  .filter-bar{display:flex;align-items:center;gap:0;flex-wrap:wrap;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 20px;margin-bottom:20px;}
  .filter-seg{display:flex;flex-direction:column;gap:3px;padding-right:24px;margin-right:24px;border-right:1px solid var(--line);}
  .filter-seg label{font-size:11px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;}
  .filter-seg select{border:none;padding:0;font-size:14.5px;font-weight:700;background:transparent;color:var(--ink);}
  .filter-seg select:focus{outline:none;}
  .filter-spacer{flex:1;}

  select, input[type=text], input[type=password], input[type=number]{font-family:inherit;font-size:14px;padding:8px 11px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;}
  select:focus, input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .btn{font-family:inherit;font-size:13px;font-weight:700;padding:9px 16px;border-radius:9px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;}
  .btn:hover{border-color:var(--ink-faint);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn-primary:hover{background:#2340E0;border-color:#2340E0;}
  .btn-text{border:none;background:none;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;padding:4px 2px;}
  .btn-arrow{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;border:none;display:inline-flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;flex:none;}
  .btn-arrow:hover{background:#2340E0;}
  .add-person-inline{display:flex;gap:6px;align-items:center;}
  .team-manager{padding:16px 20px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;}
  .team-manager-list{margin-top:12px;display:flex;flex-direction:column;gap:2px;max-height:220px;overflow-y:auto;}
  .team-manager-item{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;padding:8px 2px;border-bottom:1px solid var(--line);}

  .quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}

  .month-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:18px;}
  .month-nav button{width:34px;height:34px;border-radius:9px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:15px;line-height:1;}
  .month-nav button:hover{background:#2340E0;}
  .month-nav .label{font-size:19px;font-weight:800;letter-spacing:-0.01em;min-width:180px;text-align:center;text-transform:capitalize;}

  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .weekday-row div{text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .day-cell{aspect-ratio:1/1;background:var(--surface);border-radius:10px;box-shadow:0 2px 8px rgba(10,14,40,0.05);display:flex;flex-direction:column;justify-content:space-between;padding:6px 7px;cursor:pointer;min-height:52px;position:relative;}
  .day-cell.blank{background:transparent;box-shadow:none;cursor:default;}
  .day-cell.weekend{background:var(--weekend-bg);}
  .day-cell.holiday{background:var(--holiday-bg);}
  .day-cell:hover:not(.blank){box-shadow:0 4px 14px rgba(10,14,40,0.14);}
  .day-cell.today{box-shadow:inset 0 0 0 2px var(--accent);}
  .day-num{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .day-badge{align-self:flex-start;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px;}
  .badge-P{background:var(--presencial);color:#fff;} .badge-H{background:var(--home);color:#fff;}
  .badge-E{background:var(--externo);color:#fff;} .badge-O{background:var(--outro);color:#fff;}
  .day-plus{font-size:14px;color:var(--ink-faint);align-self:flex-start;}
  .badge-row{display:flex;gap:3px;flex-wrap:wrap;align-self:flex-start;}
  .holiday-tag{font-size:8.5px;font-weight:800;color:var(--holiday-ink);letter-spacing:0.01em;line-height:1.2;}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);font-weight:600;}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .dot-P{background:var(--presencial);} .dot-H{background:var(--home);} .dot-E{background:var(--externo);} .dot-O{background:var(--outro);} .dot-feriado{background:var(--holiday-bg);border:1px solid var(--holiday-ink);}

  .overlay{position:fixed;inset:0;background:rgba(10,14,40,0.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;max-width:380px;width:100%;}
  .modal h3{margin:0 0 2px;font-size:17px;font-weight:800;text-transform:capitalize;}
  .modal .modal-person{font-size:12px;color:var(--ink-soft);margin-bottom:16px;font-weight:600;}
  .status-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .status-opt{border:1.5px solid var(--line-strong);border-radius:10px;padding:10px 8px;text-align:left;background:var(--surface);cursor:pointer;font-family:inherit;color:var(--ink);}
  .status-opt .opt-title{font-size:13px;font-weight:800;}
  .status-opt.sel-P{border-color:var(--presencial);background:var(--presencial-bg);}
  .status-opt.sel-H{border-color:var(--home);background:var(--home-bg);}
  .status-opt.sel-E{border-color:var(--externo);background:var(--externo-bg);}
  .status-opt.sel-O{border-color:var(--outro);background:var(--outro-bg);}
  .sub-field{margin-bottom:14px;}
  .sub-field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .sub-field select, .sub-field input{width:100%;}
  .range-row{display:flex;gap:10px;margin-bottom:14px;}
  .range-row .sub-field{flex:1;margin-bottom:0;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}

  .today-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
  .stat{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;position:relative;overflow:hidden;}
  .stat .ribbon{position:absolute;top:0;right:14px;width:22px;height:30px;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);}
  .stat.num-P .ribbon{background:var(--presencial);} .stat.num-H .ribbon{background:var(--home);}
  .stat.num-E .ribbon{background:var(--externo);} .stat.num-miss .ribbon{background:var(--danger);}
  .stat .num{font-size:28px;font-weight:800;letter-spacing:-0.02em;line-height:1;}
  .stat .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-top:4px;}
  .stat.num-P .num{color:var(--presencial);} .stat.num-H .num{color:var(--home);}
  .stat.num-E .num{color:var(--externo);} .stat.num-miss .num{color:var(--danger);}

  .today-list{margin-bottom:30px;}
  .today-list h2, .grid-section h2, .evolution-section h2{font-size:13px;font-weight:800;margin:0 0 12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;}
  .chip-row{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{display:flex;align-items:center;gap:7px;padding:8px 12px;background:var(--empty-bg);font-size:12.5px;font-weight:700;border-radius:9px;}
  .chip .cdot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);}
  .chip.st-P{background:var(--presencial-bg);} .chip.st-P .cdot{background:var(--presencial);}
  .chip.st-H{background:var(--home-bg);} .chip.st-H .cdot{background:var(--home);}
  .chip.st-E{background:var(--externo-bg);} .chip.st-E .cdot{background:var(--externo);}
  .chip.st-O{background:var(--outro-bg);} .chip.st-O .cdot{background:var(--outro);}
  .chip.st-none{color:var(--ink-faint);}

  .evolution-section{margin-bottom:30px;}
  .evolution-holder{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;}

  .grid-section{overflow-x:auto;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;}
  table.team-grid{border-collapse:collapse;width:100%;min-width:760px;font-size:11px;}
  table.team-grid th, table.team-grid td{border:1px solid var(--line);padding:0;text-align:center;}
  table.team-grid th{background:var(--empty-bg);font-weight:700;color:var(--ink-soft);padding:5px 2px;font-size:10.5px;}
  table.team-grid th.weekend-th{background:var(--weekend-bg);}
  table.team-grid th.holiday-th{background:var(--holiday-bg);color:var(--holiday-ink);}
  table.team-grid td.name-cell{text-align:left;padding:6px 8px;font-weight:700;white-space:nowrap;background:var(--surface);position:sticky;left:0;}
  table.team-grid td.day-td{width:22px;height:26px;font-weight:800;color:#fff;}
  table.team-grid td.weekend-td{background:var(--weekend-bg);}
  table.team-grid td.holiday-td{background:var(--holiday-bg);}
  table.team-grid td.tot-cell{font-weight:800;color:var(--ink);background:var(--surface);}

  .app-footer{background:var(--navy);margin-top:40px;padding:26px 0;}
  .app-footer-inner{width:100%;margin:0;padding:0 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .app-footer .brand{font-size:14px;}
  .app-footer .tagline{font-size:13px;color:#A9B0D6;}
  .app-footer .tagline b{color:#fff;font-weight:700;}

  .bday-badge{
    position:absolute; top:4px; right:4px; width:34px; height:34px; border-radius:50%;
    object-fit:cover; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }
  .bday-badge-fallback{
    position:absolute; top:4px; right:4px; width:34px; height:34px; border-radius:50%;
    background:var(--accent); color:#fff; font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; border:2px solid #fff;
  }
  .bday-cake-th{ position:relative; }
  .bday-cake-th::after{ content:'🎂'; position:absolute; top:1px; right:1px; font-size:8px; }

  .bday-section{ margin-bottom:26px; }
  .bday-row{ display:flex; flex-wrap:wrap; gap:12px; }
  .bday-card{
    display:flex; align-items:center; gap:10px; background:var(--surface); border-radius:12px;
    box-shadow:var(--shadow); padding:8px 14px 8px 8px; min-width:200px;
  }
  .bday-card img, .bday-card .fallback{
    width:44px; height:44px; border-radius:50%; object-fit:cover; flex:none;
  }
  .bday-card .fallback{ background:var(--accent); color:#fff; font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; }
  .bday-card .name{ font-weight:700; font-size:13px; }
  .bday-card .date{ font-size:11.5px; color:var(--ink-soft); }

  .bday-edit-row{ display:flex; align-items:center; gap:8px; margin-top:4px; flex-wrap:wrap; }
  .bday-edit-row input[type=number]{ width:52px; }
  .bday-mini-thumb{ width:26px; height:26px; border-radius:50%; object-fit:cover; }

  .occ-line{ font-size:12px; font-weight:700; padding:8px 10px; border-radius:8px; margin-bottom:10px; }
  .occ-line.occ-low{ background:#FBEAEA; color:#B23A3A; }
  .occ-line.occ-ok{ background:var(--home-bg); color:var(--home); }
  .occ-line.occ-high{ background:#FCEEDF; color:#B5722E; }
  .nudge-line{ font-size:12px; font-weight:600; color:#8A6416; background:var(--holiday-bg); padding:8px 10px; border-radius:8px; margin-bottom:10px; }

  .week-status{ display:flex; align-items:center; gap:8px; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:10px 16px; margin-bottom:18px; font-size:13px; font-weight:600; color:var(--ink-soft); }
  .week-status b{ color:var(--ink); font-size:14px; }
  .week-status.low{ color:#B23A3A; }
  .week-status.low b{ color:#B23A3A; }
  .week-status.ok{ color:var(--home); }
  .week-status.ok b{ color:var(--home); }

  table.team-grid th.occ-low-th{ box-shadow:inset 0 -3px 0 #B23A3A; }
  table.team-grid th.occ-high-th{ box-shadow:inset 0 -3px 0 #B5722E; }

  .loading{padding:60px 0;text-align:center;color:var(--ink-faint);font-weight:600;font-size:13px;}
  .hint{font-size:12px;color:var(--ink-faint);margin-top:6px;}

  @media (max-width:700px){
    .headline{font-size:28px;}
    .filter-seg{border-right:none;margin-right:0;padding-right:0;width:100%;margin-bottom:10px;}
    .nav-tabs{gap:16px;}
  }
  @media (max-width:560px){
    .today-summary{grid-template-columns:repeat(2,1fr);}
    .day-num{font-size:10px;} .day-badge{font-size:9.5px;padding:1px 4px;}
    .bday-badge, .bday-badge-fallback{width:24px;height:24px;font-size:9px;}
  }
</style>

/* ---------- helpers ---------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function monthKey(y,m){ return `${y}-${pad2(m+1)}`; }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function firstWeekday(y,m){ return new Date(y, m, 1).getDay(); }
function todayKey(){ return monthKey(now.getFullYear(), now.getMonth()); }
function isToday(y,m,d){ return y===now.getFullYear() && m===now.getMonth() && d===now.getDate(); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getEntry(monthData, person, day){ return (monthData && monthData[person] && monthData[person][String(day)]) || null; }
function setEntry(monthData, person, day, entry){
  if(!monthData[person]) monthData[person] = {};
  if(entry) monthData[person][String(day)] = entry; else delete monthData[person][String(day)];
}
function badgeText(entry){ return (!entry || !entry.statuses || !entry.statuses.length) ? '' : entry.statuses.join('/'); }

/* ---------- regras de ocupação (presencial/home office) ---------- */
const MIN_PRESENCIAL_DAY = 5;
const MAX_PRESENCIAL_DAY = 7;
const MIN_PRESENCIAL_WEEK = 2;

function presencialCountOn(year, month, day){
  const key = monthKey(year, month);
  const data = state.monthCache[key] || {};
  let count = 0;
  Object.values(data).forEach(days=>{
    const e = days[String(day)];
    if(e && e.statuses && e.statuses.includes('P')) count++;
  });
  return count;
}
function occupancyInfo(count){
  if(count < MIN_PRESENCIAL_DAY) return { cls:'occ-low', label:`${count} presencial${count===1?'':'is'} hoje · abaixo do mínimo (${MIN_PRESENCIAL_DAY})` };
  if(count > MAX_PRESENCIAL_DAY) return { cls:'occ-high', label:`${count} presenciais · acima do limite (${MAX_PRESENCIAL_DAY})` };
  return { cls:'occ-ok', label:`${count} presenciais · dentro da faixa ideal (${MIN_PRESENCIAL_DAY}–${MAX_PRESENCIAL_DAY})` };
}
function weekMondayOf(date){
  const dow = date.getDay();
  return addDays(date, dow===0 ? -6 : 1-dow);
}
function ensureWeekMonths(baseDate){
  const monday = weekMondayOf(baseDate);
  for(let i=0;i<5;i++){ const d = addDays(monday,i); watchMonth(monthKey(d.getFullYear(), d.getMonth())); }
}
function weekPresencialCount(person, baseDate){
  const monday = weekMondayOf(baseDate);
  let count = 0;
  for(let i=0;i<5;i++){
    const d = addDays(monday, i);
    const data = state.monthCache[monthKey(d.getFullYear(), d.getMonth())];
    if(!data) continue;
    const e = getEntry(data, person, d.getDate());
    if(e && e.statuses && e.statuses.includes('P')) count++;
  }
  return count;
}
function weekdayNudgeText(year, month, day, person){
  const dow = new Date(year, month, day).getDay();
  if(dow!==1 && dow!==5) return null;
  const prev = addDays(new Date(year, month, day), -7);
  const prevData = state.monthCache[monthKey(prev.getFullYear(), prev.getMonth())] || {};
  const entry = getEntry(prevData, person, prev.getDate());
  if(entry && entry.statuses && entry.statuses.includes('H') && !entry.statuses.includes('P')){
    const label = dow===1 ? 'segunda-feira' : 'sexta-feira';
    return `Você fez home office nessa ${label} da semana passada — considere priorizar presencial dessa vez, se possível.`;
  }
  return null;
}
function mixedGradient(codes, palette){
  if(codes.length===1) return palette[codes[0]];
  const stops = codes.slice(0,3); const step = 100/stops.length;
  return `linear-gradient(135deg, ${stops.map((c,i)=>`${palette[c]} ${Math.round(i*step)}%, ${palette[c]} ${Math.round((i+1)*step)}%`).join(', ')})`;
}

/* ---------- holidays (nacionais + Espírito Santo) ---------- */
function easterDate(year){
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
    g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,
    m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
  return new Date(year, month-1, day);
}
function addDays(date,n){ const d=new Date(date); d.setDate(d.getDate()+n); return d; }
function dateKey(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
const holidayCache = {};
function getHolidays(year){
  if(holidayCache[year]) return holidayCache[year];
  const easter = easterDate(year); const map = {};
  const add=(date,name)=>{ map[dateKey(date)] = name; };
  add(new Date(year,0,1), 'Ano Novo');
  add(addDays(easter,-48), 'Carnaval');
  add(addDays(easter,-47), 'Carnaval');
  add(addDays(easter,-2), 'Sexta-feira Santa');
  add(addDays(easter,8), 'Nossa Sra. da Penha (ES)');
  add(new Date(year,3,21), 'Tiradentes');
  add(new Date(year,4,1), 'Dia do Trabalho');
  add(addDays(easter,60), 'Corpus Christi');
  add(new Date(year,8,7), 'Independência do Brasil');
  add(new Date(year,9,12), 'Nossa Sra. Aparecida');
  add(new Date(year,10,2), 'Finados');
  add(new Date(year,10,15), 'Proclamação da República');
  add(new Date(year,10,20), 'Consciência Negra');
  add(new Date(year,11,25), 'Natal');
  holidayCache[year] = map;
  return map;
}
function holidayFor(year,month,day){ return getHolidays(year)[dateKey(new Date(year,month,day))] || null; }

/* ---------- gate ---------- */
function getTheme(){ return localStorage.getItem('cim-theme') || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark':'light'); }
function applyTheme(){ document.documentElement.setAttribute('data-theme', getTheme()); }
function toggleTheme(){ localStorage.setItem('cim-theme', getTheme()==='dark' ? 'light':'dark'); applyTheme(); render(); }
applyTheme();

function renderGate(){
  document.getElementById('app').innerHTML = `
    <div class="gate-wrap"><div class="gate-box">
      <h1>CIM · Rodízio</h1>
      <p>Digite a senha da equipe para acessar o rodízio.</p>
      <div class="gate-error" id="gate-error"></div>
      <input type="password" id="gate-input" placeholder="Senha">
      <button class="btn btn-primary" id="gate-btn" style="width:100%;">Entrar</button>
    </div></div>`;
  const tryLogin = ()=>{
    const val = document.getElementById('gate-input').value;
    if(val === SHARED_PASSCODE){ localStorage.setItem('cim-auth','ok'); boot(); }
    else { document.getElementById('gate-error').textContent = 'Senha incorreta.'; }
  };
  document.getElementById('gate-btn').onclick = tryLogin;
  document.getElementById('gate-input').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
}

/* ---------- data layer ---------- */
function watchMonth(key){
  if(state.watched[key]) return;
  state.watched[key] = true;
  onSnapshot(doc(db,'meses',key), snap=>{ state.monthCache[key] = snap.exists() ? snap.data() : {}; render(); }, err=>console.error(err));
}
async function getMonthDataOnce(key){
  if(state.monthCache[key]) return state.monthCache[key];
  try{
    const snap = await getDoc(doc(db,'meses',key));
    state.monthCache[key] = snap.exists() ? snap.data() : {};
  }catch(e){ console.error(e); state.monthCache[key] = {}; }
  watchMonth(key);
  return state.monthCache[key];
}
async function saveMonth(key){
  try{ await setDoc(doc(db,'meses',key), state.monthCache[key] || {}); }
  catch(e){ console.error(e); alert('Não foi possível salvar agora. Verifique sua conexão e tente novamente.'); }
}
function watchTeam(){
  onSnapshot(doc(db,'meta','equipe'), async snap=>{
    if(snap.exists()){ state.team = snap.data().nomes || []; }
    else { state.team = DEFAULT_TEAM.slice(); await setDoc(doc(db,'meta','equipe'), {nomes: state.team}); }
    render();
  }, err=>console.error(err));
}
async function saveTeam(){ try{ await setDoc(doc(db,'meta','equipe'), {nomes: state.team}); }catch(e){ console.error(e); } }

function watchBirthdays(){
  onSnapshot(doc(db,'meta','aniversarios'), async snap=>{
    if(snap.exists()){ state.birthdays = snap.data() || {}; }
    else { state.birthdays = DEFAULT_BIRTHDAYS; await setDoc(doc(db,'meta','aniversarios'), state.birthdays); }
    render();
  }, err=>console.error(err));
}
async function saveBirthdays(){ try{ await setDoc(doc(db,'meta','aniversarios'), state.birthdays); }catch(e){ console.error(e); alert('Não foi possível salvar o aniversário agora.'); } }
function birthdaysOn(month1based, day){
  return Object.entries(state.birthdays)
    .filter(([name, b]) => b && b.mes === month1based && b.dia === day)
    .map(([name, b]) => ({ name, ...b }));
}
function loadPerson(){ state.person = localStorage.getItem('meu-nome') || null; }
function savePerson(name){ state.person = name; localStorage.setItem('meu-nome', name); }

function boot(){
  loadPerson();
  watchTeam();
  watchBirthdays();
  ensureWeekMonths(now);
  watchMonth(monthKey(state.year, state.month));
  if(monthKey(state.year,state.month) !== todayKey()) watchMonth(todayKey());
  render();
}

function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase();
}

function resizeImageFile(file, size){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const side = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function bindPersonRow(afterChange){
  document.getElementById('person-select').onchange = (e)=>{ if(e.target.value){ savePerson(e.target.value); } afterChange(); };
  document.getElementById('toggle-manage-team').onclick = ()=>{ state.managingTeam = !state.managingTeam; afterChange(); };
  const confirmBtn = document.getElementById('confirm-add-person');
  if(confirmBtn) confirmBtn.onclick = async ()=>{
    const input = document.getElementById('new-person-input');
    const name = input.value.trim();
    if(!name) return;
    if(!state.team.includes(name)){ state.team.push(name); state.team.sort((a,b)=>a.localeCompare(b,'pt-BR')); await saveTeam(); }
    input.value=''; afterChange();
  };
  document.querySelectorAll('.remove-person').forEach(btn=>{
    btn.onclick = async ()=>{
      const name = btn.dataset.name;
      if(!confirm(`Remover ${name} da equipe? O histórico de dias marcados não é apagado, ela só some da lista.`)) return;
      state.team = state.team.filter(n=>n!==name); await saveTeam();
      if(state.person === name){ state.person=null; localStorage.removeItem('meu-nome'); }
      afterChange();
    };
  });
  document.querySelectorAll('.edit-bday').forEach(btn=>{
    btn.onclick = ()=>{ state.editingBirthdayFor = (state.editingBirthdayFor===btn.dataset.name) ? null : btn.dataset.name; afterChange(); };
  });
  const saveBdayBtn = document.getElementById('save-bday');
  if(saveBdayBtn) saveBdayBtn.onclick = async ()=>{
    const name = state.editingBirthdayFor;
    const dia = parseInt(document.getElementById('bday-dia').value, 10);
    const mes = parseInt(document.getElementById('bday-mes').value, 10);
    if(!dia || !mes || dia<1 || dia>31 || mes<1 || mes>12){ alert('Preencha dia (1-31) e mês (1-12) válidos.'); return; }
    const fileInput = document.getElementById('bday-foto');
    const existing = state.birthdays[name] || {};
    let foto = existing.foto;
    if(fileInput.files && fileInput.files[0]){ foto = await resizeImageFile(fileInput.files[0], 140); }
    state.birthdays[name] = { dia, mes, ...(foto?{foto}:{}) };
    await saveBirthdays();
    state.editingBirthdayFor = null;
    afterChange();
  };
}

function renderCalendar(){
  const holder = document.getElementById('calendar-holder');
  if(!holder) return;
  if(!state.person){ holder.innerHTML = `<p class="hint">Selecione seu nome acima para começar a marcar seus dias.</p>`; return; }
  const key = monthKey(state.year, state.month);
  const monthData = state.monthCache[key] || {};
  const nDays = daysInMonth(state.year, state.month);
  const lead = firstWeekday(state.year, state.month);

  let cells = '';
  for(let i=0;i<lead;i++) cells += `<div class="day-cell blank"></div>`;
  for(let d=1; d<=nDays; d++){
    const entry = getEntry(monthData, state.person, d);
    const hasEntry = entry && entry.statuses && entry.statuses.length;
    const weekday = new Date(state.year, state.month, d).getDay();
    const weekend = (weekday===0 || weekday===6);
    const holiday = holidayFor(state.year, state.month, d);
    const todayClass = isToday(state.year,state.month,d) ? 'today' : '';
    const bgStyle = hasEntry ? `style="background:${mixedGradient(entry.statuses, getTheme()==='dark' ? STATUS_BG_DARK : STATUS_BG_LIGHT)};"` : '';
    const badges = hasEntry ? `<div class="badge-row">${entry.statuses.map(c=>`<span class="day-badge badge-${c}">${c}</span>`).join('')}</div>` : (holiday ? `<div class="holiday-tag">${escapeHtml(holiday)}</div>` : `<div class="day-plus">+</div>`);
    const bdays = birthdaysOn(state.month+1, d);
    const bdayHTML = bdays.length ? (bdays[0].foto
      ? `<img class="bday-badge" src="${bdays[0].foto}" title="🎂 ${escapeHtml(bdays.map(b=>b.name).join(', '))}">`
      : `<div class="bday-badge-fallback" title="🎂 ${escapeHtml(bdays.map(b=>b.name).join(', '))}">${initials(bdays[0].name)}</div>`) : '';
    cells += `<div class="day-cell ${weekend?'weekend':''} ${holiday?'holiday':''} ${todayClass}" ${bgStyle} data-day="${d}" title="${holiday?escapeHtml(holiday):''}"><div class="day-num">${d}</div>${badges}${bdayHTML}</div>`;
  }
  const trail = (7 - ((lead + nDays) % 7)) % 7;
  for(let i=0;i<trail;i++) cells += `<div class="day-cell blank"></div>`;

  holder.innerHTML = `
    <div class="weekday-row">${WEEKDAYS.map(w=>`<div>${w}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="legend">
      <div class="legend-item"><span class="dot dot-P"></span>Presencial</div>
      <div class="legend-item"><span class="dot dot-H"></span>Home office</div>
      <div class="legend-item"><span class="dot dot-E"></span>Externo</div>
      <div class="legend-item"><span class="dot dot-O"></span>Outro / observação</div>
      <div class="legend-item"><span class="dot dot-feriado"></span>Feriado</div>
      <div class="legend-item">🎂 Aniversário</div>
    </div>`;
  holder.querySelectorAll('.day-cell:not(.blank)').forEach(c=>{ c.onclick = ()=> openModal(parseInt(c.dataset.day,10)); });
}

/* ---------- modal (dia único + período) ---------- */
async function openModal(day){
  const key = monthKey(state.year, state.month);
  const monthData = state.monthCache[key] || {};
  const existing = getEntry(monthData, state.person, day);
  state.modalType = 'day'; state.modalDay = day;
  state.modalDraft = existing ? { statuses:[...(existing.statuses||[])], local: existing.local, note: existing.note } : {statuses:[]};
  const dow = new Date(state.year, state.month, day).getDay();
  if(dow===1 || dow===5){
    const prev = addDays(new Date(state.year, state.month, day), -7);
    await getMonthDataOnce(monthKey(prev.getFullYear(), prev.getMonth()));
  }
  render();
}
function openBulkModal(){
  if(!state.person){ alert('Selecione seu nome antes.'); return; }
  state.modalType = 'bulk';
  state.bulkDraft = { start:1, end:1, statuses:[], local:'', note:'' };
  render();
}
function closeModal(){ state.modalType=null; state.modalDay=null; state.modalDraft=null; state.bulkDraft=null; state.exportDraft=null; const ov=document.getElementById('overlay'); if(ov) ov.remove(); render(); }

function renderModal(){
  let ov = document.getElementById('overlay');
  if(!ov){ ov = document.createElement('div'); ov.className='overlay'; ov.id='overlay'; document.body.appendChild(ov);
    ov.addEventListener('click', (e)=>{ if(e.target===ov) closeModal(); }); }
  if(state.modalType==='day') renderDayModal(ov);
  else if(state.modalType==='bulk') renderBulkModal(ov);
  else if(state.modalType==='export') renderExportModal(ov);
}

function renderDayModal(ov){

async function persistDayDraft(){
  const key = monthKey(state.year, state.month);

  await saveMonth(key);
}

  ov.querySelectorAll('.status-opt').forEach(b=>{

    const start = Math.min(dd.start, dd.end), end = Math.max(dd.start, dd.end);
    if(!confirm(`Limpar os dias ${start} a ${end} de ${escapeHtml(state.person)}? Essa ação não pode ser desfeita.`)) return;
    const key = monthKey(state.year, state.month);
    const monthData = state.monthCache[key] || (state.monthCache[key] = {});
    for(let day=start; day<=end; day++){ setEntry(monthData, state.person, day, null); }

    const key = monthKey(state.year, state.month);
    const monthData = state.monthCache[key] || (state.monthCache[key] = {});
    for(let day=start; day<=end; day++){
      setEntry(monthData, state.person, day, { statuses:[...dd.statuses], local: dd.local, note: dd.note });
    }
    await saveMonth(key);
    closeModal();
  };
}

/* ---------- exportar relatório ---------- */
function openExportModal(){
  state.modalType = 'export';
  state.exportDraft = { year: state.year, month: state.month };
  render();
}

function renderExportModal(ov){
  const d = state.exportDraft;
  const monthOpts = MONTHS.map((m,i)=>`<option value="${i}" ${i===d.month?'selected':''}>${m}</option>`).join('');
  ov.innerHTML = `
    <div class="modal">
      <h3>Exportar relatório</h3>
      <div class="modal-person">Resumo de cada colaborador no mês escolhido, com sinalização de quem não cumpriu o mínimo de ${MIN_PRESENCIAL_WEEK} dias presenciais em alguma semana.</div>
      <div class="range-row">
        <div class="sub-field"><label>Mês</label><select id="export-month">${monthOpts}</select></div>
        <div class="sub-field"><label>Ano</label><input type="number" id="export-year" value="${d.year}" min="2024" max="2035"></div>
      </div>
      <div class="modal-actions" style="gap:10px;">
        <button class="btn-text" id="close-modal">cancelar</button>
        <div style="display:flex;gap:8px;">
          <button class="btn" id="export-xlsx-btn">⬇️ Excel</button>
          <button class="btn btn-primary" id="export-pdf-btn">⬇️ PDF</button>
        </div>
      </div>
    </div>`;
  document.getElementById('export-month').onchange = (e)=>{ state.exportDraft.month = parseInt(e.target.value,10); };
  document.getElementById('export-year').onchange = (e)=>{ state.exportDraft.year = parseInt(e.target.value,10); };
  document.getElementById('close-modal').onclick = closeModal;
  document.getElementById('export-xlsx-btn').onclick = async (e)=>{
    e.target.textContent = 'Gerando…';
    const { rows, year, month } = await buildReportData(state.exportDraft.year, state.exportDraft.month);
    exportExcel(rows, year, month);
    e.target.textContent = '⬇️ Excel';
  };
  document.getElementById('export-pdf-btn').onclick = async (e)=>{
    e.target.textContent = 'Gerando…';
    const { rows, year, month } = await buildReportData(state.exportDraft.year, state.exportDraft.month);
    exportPDF(rows, year, month);
    e.target.textContent = '⬇️ PDF';
  };
}

async function buildReportData(year, month){
  const key = monthKey(year, month);
  const data = await getMonthDataOnce(key);
  const nDays = daysInMonth(year, month);

  const weeksMap = {};
  for(let d=1; d<=nDays; d++){
    const date = new Date(year, month, d);
    const dow = date.getDay();
    if(dow===0 || dow===6) continue;
    const mkey = dateKey(weekMondayOf(date));
    if(!weeksMap[mkey]) weeksMap[mkey] = [];
    weeksMap[mkey].push(d);
  }
  const weekKeys = Object.keys(weeksMap).sort();

  const rows = state.team.map(person=>{
    const totals = { P:0, H:0, E:0, O:0 };
    let weeksBelow = 0;
    weekKeys.forEach(wk=>{
      let pCount = 0;
      weeksMap[wk].forEach(d=>{
        const e = getEntry(data, person, d);
        if(e && e.statuses){
          e.statuses.forEach(s=>{ totals[s] = (totals[s]||0)+1; });
          if(e.statuses.includes('P')) pCount++;
        }
      });
      if(pCount < MIN_PRESENCIAL_WEEK) weeksBelow++;
    });
    return {
      nome: person, presencial: totals.P, homeoffice: totals.H, externo: totals.E, outro: totals.O,
      semanasAbaixo: weeksBelow, totalSemanas: weekKeys.length,
      status: weeksBelow>0 ? 'Ofensor' : 'Cumprindo'
    };
  });
  return { rows, year, month };
}

function exportExcel(rows, year, month){
  const header = ['Colaborador','Presencial','Home Office','Externo','Outro','Semanas abaixo da meta','Total de semanas','Status'];
  const aoa = [header, ...rows.map(r=>[r.nome, r.presencial, r.homeoffice, r.externo, r.outro, r.semanasAbaixo, r.totalSemanas, r.status])];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:22},{wch:11},{wch:13},{wch:9},{wch:8},{wch:22},{wch:15},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Relatório');
  XLSX.writeFile(wb, `relatorio-rodizio-${MONTHS[month]}-${year}.xlsx`);
}

function exportPDF(rows, year, month){
  const { jsPDF } = window.jspdf;
  const docpdf = new jsPDF();
  docpdf.setFontSize(16); docpdf.text('Relatório · Rodízio CIM', 14, 18);
  docpdf.setFontSize(11); docpdf.setTextColor(90,97,120); docpdf.text(`${MONTHS[month]} de ${year}`, 14, 26);
  docpdf.autoTable({
    startY: 32,
    head: [['Colaborador','P','H','E','O','Semanas abaixo','Status']],
    body: rows.map(r=>[r.nome, r.presencial, r.homeoffice, r.externo, r.outro, `${r.semanasAbaixo}/${r.totalSemanas}`, r.status]),
    styles:{ fontSize:9, cellPadding:4 },
    headStyles:{ fillColor:[46,79,255], textColor:[255,255,255] },
    didParseCell: function(cellData){
      if(cellData.section==='body' && cellData.column.index===6 && cellData.cell.raw==='Ofensor'){
        cellData.cell.styles.textColor = [178,58,58];
        cellData.cell.styles.fontStyle = 'bold';
      }
    }
  });
  docpdf.save(`relatorio-rodizio-${MONTHS[month]}-${year}.pdf`);
}

/* ---------- painel da equipe ---------- */
function renderPainelTab(){
  const el = document.getElementById('tab-content');
  el.innerHTML = monthNavHTML() + `
    <div class="quick-actions" style="justify-content:center;">
      <button class="btn" id="export-report-btn">📄 Exportar relatório</button>
    </div>
  ` + `<div id="painel-holder"></div>`;
  bindMonthNav(renderPainelTab);
  document.getElementById('export-report-btn').onclick = openExportModal;
  renderPainelContent();
}

function renderPainelContent(){
  const holder = document.getElementById('painel-holder');
  if(!holder) return;
  const tKey = todayKey();
  const todayData = state.monthCache[tKey] || {};
  const d = now.getDate();

  let cP=0,cH=0,cE=0,cMiss=0;
  const chips = state.team.map(person=>{
    const entry = getEntry(todayData, person, d);
    const hasEntry = entry && entry.statuses && entry.statuses.length;
    if(hasEntry){ entry.statuses.forEach(s=>{ if(s==='P')cP++; else if(s==='H')cH++; else if(s==='E')cE++; }); } else cMiss++;
    const cls = hasEntry ? `st-${entry.statuses[0]}` : 'st-none';
    const label = hasEntry ? entry.statuses.map(s=> s==='E'&&entry.local ? `Externo · ${entry.local}` : STATUS_META[s].label).join(' + ') : 'não preenchido';
    return `<div class="chip ${cls}"><span class="cdot"></span>${escapeHtml(person)} — ${label}</div>`;
  }).join('');

  const key = monthKey(state.year, state.month);
  const monthData = state.monthCache[key] || {};
  const nDays = daysInMonth(state.year, state.month);
  const todayCmp = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let headerCells = '';
  for(let dd=1; dd<=nDays; dd++){
    const h = holidayFor(state.year, state.month, dd);
    const weekday = new Date(state.year, state.month, dd).getDay();
    const weekend = (weekday===0||weekday===6);
    const bdays = birthdaysOn(state.month+1, dd);
    const bdayCls = bdays.length ? 'bday-cake-th' : '';
    const pCount = presencialCountOn(state.year, state.month, dd);
    const isPastOrToday = new Date(state.year, state.month, dd) <= todayCmp;
    let occCls = '';
    if(!weekend && !h){
      if(pCount > MAX_PRESENCIAL_DAY) occCls = 'occ-high-th';
      else if(isPastOrToday && pCount < MIN_PRESENCIAL_DAY) occCls = 'occ-low-th';
    }
    const occTitle = (!weekend && !h) ? ` · ${pCount} presenciais (mín ${MIN_PRESENCIAL_DAY} / máx ${MAX_PRESENCIAL_DAY})` : '';
    const titleParts = [h, bdays.length ? ('🎂 '+bdays.map(b=>b.name).join(', ')) : ''].filter(Boolean).join(' · ') + occTitle;
    headerCells += `<th class="${h?'holiday-th':(weekend?'weekend-th':'')} ${bdayCls} ${occCls}" title="${escapeHtml(titleParts)}">${dd}</th>`;
  }

  let rows = '';
  state.team.forEach(person=>{
    let cells=''; let totP=0,totH=0,totE=0;
    for(let dd=1; dd<=nDays; dd++){
      const entry = getEntry(monthData, person, dd);
      const hasEntry = entry && entry.statuses && entry.statuses.length;
      const weekday = new Date(state.year, state.month, dd).getDay();
      const weekend = (weekday===0||weekday===6);
      const holiday = holidayFor(state.year, state.month, dd);
      if(hasEntry){
        entry.statuses.forEach(s=>{ if(s==='P')totP++; else if(s==='H')totH++; else if(s==='E')totE++; });
        const title = `${escapeHtml(person)} · dia ${dd} · ${entry.statuses.map(s=>STATUS_META[s].label).join(' + ')}${entry.local?(' · '+entry.local):''}${entry.note?(' · '+escapeHtml(entry.note)):''}`;
        cells += `<td class="day-td" style="background:${mixedGradient(entry.statuses, STATUS_SOLID)};" title="${title}">${badgeText(entry)}</td>`;
      } else {
        cells += `<td class="day-td ${holiday?'holiday-td':(weekend?'weekend-td':'')}" title="${holiday?escapeHtml(holiday):''}"></td>`;
      }
    }
    rows += `<tr><td class="name-cell">${escapeHtml(person)}</td>${cells}<td class="tot-cell">${totP}</td><td class="tot-cell">${totH}</td><td class="tot-cell">${totE}</td></tr>`;
  });

  const monthBdays = [];
  for(let dd=1; dd<=nDays; dd++){ birthdaysOn(state.month+1, dd).forEach(b=>monthBdays.push({...b, dia:dd})); }
  const bdayCardsHTML = monthBdays.map(b=>`
    <div class="bday-card">
      ${b.foto ? `<img src="${b.foto}">` : `<div class="fallback">${initials(b.name)}</div>`}
      <div><div class="name">${escapeHtml(b.name)}</div><div class="date">🎂 dia ${b.dia}</div></div>
    </div>`).join('');

  holder.innerHTML = `
    <div class="today-summary">
      <div class="stat num-P"><div class="ribbon"></div><div class="num">${cP}</div><div class="lbl">Presencial hoje</div></div>
      <div class="stat num-H"><div class="ribbon"></div><div class="num">${cH}</div><div class="lbl">Home office hoje</div></div>
      <div class="stat num-E"><div class="ribbon"></div><div class="num">${cE}</div><div class="lbl">Externo hoje</div></div>
      <div class="stat num-miss"><div class="ribbon"></div><div class="num">${cMiss}</div><div class="lbl">Não preencheram</div></div>
    </div>
    <div class="today-list">
      <h2>Hoje · ${now.toLocaleDateString('pt-BR',{day:'numeric',month:'long'})}</h2>
      <div class="chip-row">${chips}</div>
    </div>
    ${monthBdays.length ? `
    <div class="bday-section">
      <h2>🎂 Aniversariantes de ${MONTHS[state.month]}</h2>
      <div class="bday-row">${bdayCardsHTML}</div>
    </div>` : ''}
    <div class="grid-section">
      <h2>${MONTHS[state.month]} de ${state.year} · visão completa</h2>
      <table class="team-grid">
        <thead><tr><th style="text-align:left;">Colaborador</th>${headerCells}<th>P</th><th>H</th><th>E</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="legend">
        <div class="legend-item"><span class="dot dot-P"></span>Presencial</div>
        <div class="legend-item"><span class="dot dot-H"></span>Home office</div>
        <div class="legend-item"><span class="dot dot-E"></span>Externo</div>
        <div class="legend-item"><span class="dot dot-O"></span>Outro / observação</div>
        <div class="legend-item"><span class="dot dot-feriado"></span>Feriado</div>
      <div class="legend-item">🎂 Aniversário</div>
        <div class="legend-item"><span style="width:9px;height:9px;box-shadow:inset 0 -3px 0 #B23A3A;display:inline-block;"></span>Abaixo de ${MIN_PRESENCIAL_DAY} presenciais</div>
        <div class="legend-item"><span style="width:9px;height:9px;box-shadow:inset 0 -3px 0 #B5722E;display:inline-block;"></span>Acima de ${MAX_PRESENCIAL_DAY} presenciais</div>
      </div>
    </div>`;
}

/* ---------- start ---------- */
if(localStorage.getItem('cim-auth') === 'ok'){ boot(); } else { renderGate(); }
</script>
